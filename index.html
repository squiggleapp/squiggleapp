document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

        <circle cx=\"148\" cy=\"452\" r=\"5\" fill=\"#F3EFE6\"><\u002Fcircle>\n      <\u002Fsvg>\n      <div style=\"position:absolute;left:16px;bottom:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:1.2px;color:#6E655A;\">18.4 MI · 1H 22M · SOMERVILLE<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:22px;order:1;animation:sq-fade .7s ease-out both;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:2px;color:#6E655A;\">GREATER BOSTON · ROUTE GENERATOR<\u002Fdiv>\n      <h1 style=\"margin:0;font-weight:900;font-size:clamp(40px,6.4vw,74px);line-height:.95;letter-spacing:-2.6px;text-wrap:balance;\">Loops that start and end at your front door.<\u002Fh1>\n      <p style=\"margin:0;font-size:clamp(16px,1.5vw,18.5px);font-weight:500;line-height:1.55;color:#4A443D;max-width:46ch;text-wrap:pretty;\">Tell Squiggle how far you want to go. It finds the shape — quiet streets, the rail trail, the long way around the reservoir — and hands you back something you can actually ride.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:4px;\">\n        <a href=\"{{ appUrl }}\" style=\"display:flex;align-items:center;height:54px;padding:0 30px;background:#B5502F;color:#FBF8F1;font-weight:800;font-size:15px;letter-spacing:.6px;border-radius:2px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16);\" style-hover=\"background:#8A3A1E;\" style-active=\"transform:translateY(1px);\">Open Squiggle<\u002Fa>\n        <a href=\"#how\" style=\"display:flex;align-items:center;height:54px;padding:0 22px;border:1px solid rgba(28,24,21,.22);color:#1C1815;font-weight:700;font-size:14.5px;border-radius:2px;\" style-hover=\"border-color:#1C1815;background:#EAE4D8;\">See how it works<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px 20px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:1.2px;color:#6E655A;padding-top:6px;border-top:1px solid rgba(28,24,21,.13);\">\n        <span>FREE TO START<\u002Fspan><span>NO APP STORE<\u002Fspan><span>WORKS OFFLINE<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"how\" style=\"border-top:1px solid rgba(28,24,21,.13);\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:clamp(44px,6vw,84px) clamp(18px,4vw,44px);\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:clamp(26px,3vw,44px);\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:2px;color:#8A3A1E;\">01<\u002Fspan>\n        <h2 style=\"margin:0;font-weight:900;font-size:clamp(26px,3.4vw,40px);letter-spacing:-1.2px;\">Three taps, then you're outside<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:rgba(28,24,21,.13);border:1px solid rgba(28,24,21,.13);\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"background:#F3EFE6;padding:clamp(22px,2.6vw,32px);display:flex;flex-direction:column;gap:11px;min-height:220px;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:2px;color:#6E655A;\">{{ s.n }}<\u002Fdiv>\n            <div style=\"font-weight:800;font-size:20px;letter-spacing:-.5px;line-height:1.15;\">{{ s.title }}<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:500;line-height:1.55;color:#4A443D;text-wrap:pretty;\">{{ s.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"screens\" style=\"border-top:1px solid rgba(28,24,21,.13);background:#EDEAE0;\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:clamp(44px,6vw,84px) clamp(18px,4vw,44px);\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:clamp(26px,3vw,44px);\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:2px;color:#8A3A1E;\">02<\u002Fspan>\n        <h2 style=\"margin:0;font-weight:900;font-size:clamp(26px,3.4vw,40px);letter-spacing:-1.2px;\">The whole thing<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(20px,3vw,40px);\">\n        <figure style=\"margin:0;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"position:relative;aspect-ratio:720/1300;background:#1C1815;border-radius:26px;padding:7px;box-shadow:0 18px 40px rgba(28,24,21,.16);\">\n            <div style=\"position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:#EAE4D8;\">\n              <image-slot id=\"sq-shot-home\" shape=\"rect\" fit=\"cover\" src=\"32ca3f16-9f51-4eec-9d06-c2bbebda604e\" placeholder=\"Drop the home screen\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption style=\"display:flex;flex-direction:column;gap:3px;\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1.6px;color:#8A3A1E;\">HOME<\u002Fspan>\n            <span style=\"font-weight:800;font-size:16px;letter-spacing:-.3px;\">Say how far<\u002Fspan>\n            <span style=\"font-size:14px;font-weight:500;color:#4A443D;line-height:1.5;\">A slider, three presets, one button.<\u002Fspan>\n          <\u002Ffigcaption>\n        <\u002Ffigure>\n        <figure style=\"margin:0;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"position:relative;aspect-ratio:720/1300;background:#1C1815;border-radius:26px;padding:7px;box-shadow:0 18px 40px rgba(28,24,21,.16);\">\n            <div style=\"position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:#EAE4D8;\">\n              <image-slot id=\"sq-shot-deck\" shape=\"rect\" fit=\"cover\" src=\"5f30df66-8459-48c2-9a25-5a47072d051d\" placeholder=\"Drop the route deck\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption style=\"display:flex;flex-direction:column;gap:3px;\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1.6px;color:#8A3A1E;\">THE PILE<\u002Fspan>\n            <span style=\"font-weight:800;font-size:16px;letter-spacing:-.3px;\">Pick from five<\u002Fspan>\n            <span style=\"font-size:14px;font-weight:500;color:#4A443D;line-height:1.5;\">Swipe off the ones that look boring.<\u002Fspan>\n          <\u002Ffigcaption>\n        <\u002Ffigure>\n        <figure style=\"margin:0;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"position:relative;aspect-ratio:720/1300;background:#1C1815;border-radius:26px;padding:7px;box-shadow:0 18px 40px rgba(28,24,21,.16);\">\n            <div style=\"position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:#EAE4D8;\">\n              <image-slot id=\"sq-shot-route\" shape=\"rect\" fit=\"cover\" src=\"6ea3c69d-cd8f-4eca-b98a-eab7d038569a\" placeholder=\"Drop a route on the map\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption style=\"display:flex;flex-direction:column;gap:3px;\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1.6px;color:#8A3A1E;\">THE ROUTE<\u002Fspan>\n            <span style=\"font-weight:800;font-size:16px;letter-spacing:-.3px;\">See what you signed up for<\u002Fspan>\n            <span style=\"font-size:14px;font-weight:500;color:#4A443D;line-height:1.5;\">Climb, surface, and every junction worth knowing about.<\u002Fspan>\n          <\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"where\" style=\"border-top:1px solid rgba(28,24,21,.13);\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:clamp(44px,6vw,84px) clamp(18px,4vw,44px);\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:18px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:2px;color:#8A3A1E;\">03<\u002Fspan>\n        <h2 style=\"margin:0;font-weight:900;font-size:clamp(26px,3.4vw,40px);letter-spacing:-1.2px;\">Where it works<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 clamp(30px,3.4vw,46px);font-size:clamp(16px,1.5vw,18px);font-weight:500;line-height:1.55;color:#4A443D;max-width:58ch;text-wrap:pretty;\">Squiggle knows Greater Boston. Not in the vague marketing sense — it has the rail trails, the crash-heavy intersections, the paths that go pitch dark at nine, and the bakeries that are open when you get there.<\u002Fp>\n\n      <div style=\"display:flex;flex-direction:column;gap:clamp(26px,3vw,38px);\">\n        <sc-for list=\"{{ rings }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:9px;border-bottom:1px solid rgba(28,24,21,.2);\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:2px;color:#1C1815;\">{{ r.label }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:1.2px;color:#6E655A;\">{{ r.count }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"columns:150px;column-gap:clamp(20px,3vw,40px);\">\n              <sc-for list=\"{{ r.towns }}\" as=\"t\" hint-placeholder-count=\"12\">\n                <div style=\"break-inside:avoid;font-size:14.5px;font-weight:500;color:#2E2822;padding:5px 0;border-bottom:1px solid rgba(28,24,21,.09);\">{{ t }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showWaitlist }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:clamp(34px,4vw,54px);border:1px solid rgba(76,91,60,.4);background:#EDF0E4;padding:clamp(22px,3vw,34px);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(20px,3vw,36px);align-items:start;\">\n          <div style=\"display:flex;flex-direction:column;gap:9px;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:2px;color:#4C5B3C;\">MORE TO COME<\u002Fdiv>\n            <div style=\"font-weight:800;font-size:clamp(20px,2.2vw,26px);letter-spacing:-.7px;line-height:1.15;\">Tell us where you ride<\u002Fdiv>\n            <div style=\"font-size:14.5px;font-weight:500;line-height:1.55;color:#4A5340;max-width:40ch;text-wrap:pretty;\">New regions get added where riders actually ask for them. Put your city in and we'll email you the day it's live. That's the only thing we'll email you about.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ waitDone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px;border:1px solid rgba(76,91,60,.4);background:#F3EFE6;padding:18px;\">\n              <div style=\"font-weight:800;font-size:14px;letter-spacing:.6px;color:#4C5B3C;\">YOU'RE ON THE LIST<\u002Fdiv>\n              <div style=\"font-size:14px;font-weight:500;color:#4A5340;line-height:1.5;\">{{ waitMsg }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ waitOpen }}\" hint-placeholder-val=\"{{ true }}\">\n            <form sc-camel-on-submit=\"{{ submitWait }}\" style=\"display:flex;flex-direction:column;gap:10px;\">\n              <input value=\"{{ waitEmail }}\" sc-camel-on-change=\"{{ onEmail }}\" type=\"email\" required=\"{{ true }}\" placeholder=\"you@email.com\" aria-label=\"Email address\" style=\"height:50px;padding:0 14px;font-size:15px;font-weight:500;color:#1C1815;background:#F3EFE6;border:1px solid rgba(28,24,21,.24);border-radius:2px;\" style-focus=\"border-color:#4C5B3C;\">\n              <input value=\"{{ waitCity }}\" sc-camel-on-change=\"{{ onCity }}\" type=\"text\" required=\"{{ true }}\" placeholder=\"Where do you ride? (city, state)\" aria-label=\"City\" style=\"height:50px;padding:0 14px;font-size:15px;font-weight:500;color:#1C1815;background:#F3EFE6;border:1px solid rgba(28,24,21,.24);border-radius:2px;\" style-focus=\"border-color:#4C5B3C;\">\n              <button type=\"submit\" disabled=\"{{ waitBusy }}\" style=\"{{ waitBtnStyle }}\" style-active=\"transform:translateY(1px);\">{{ waitBtnLabel }}<\u002Fbutton>\n              <sc-if value=\"{{ waitErr }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:13px;font-weight:600;color:#8A3A1E;line-height:1.45;\">{{ waitErr }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fform>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"export\" style=\"border-top:1px solid rgba(28,24,21,.13);background:#1C1815;color:#F3EFE6;\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:clamp(44px,6vw,84px) clamp(18px,4vw,44px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(28px,4vw,56px);align-items:start;\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"display:flex;align-items:baseline;gap:16px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:2px;color:#D98A6A;\">04<\u002Fspan>\n          <h2 style=\"margin:0;font-weight:900;font-size:clamp(26px,3.4vw,40px);letter-spacing:-1.2px;\">It doesn't end at the screen<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:clamp(16px,1.5vw,18px);font-weight:500;line-height:1.55;color:rgba(243,239,230,.76);max-width:44ch;text-wrap:pretty;\">A route you can't get onto your bars isn't much use. Push it to RideWithGPS in one tap, or download the GPX and load it wherever you load everything else.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:rgba(243,239,230,.18);border:1px solid rgba(243,239,230,.18);\">\n        <sc-for list=\"{{ exports }}\" as=\"e\" hint-placeholder-count=\"4\">\n          <div style=\"background:#1C1815;padding:20px 18px;display:flex;flex-direction:column;gap:6px;min-height:118px;\">\n            <div style=\"font-weight:800;font-size:15.5px;letter-spacing:-.2px;\">{{ e.name }}<\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:500;line-height:1.45;color:rgba(243,239,230,.62);\">{{ e.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"pricing\" style=\"border-top:1px solid rgba(28,24,21,.13);\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:clamp(44px,6vw,84px) clamp(18px,4vw,44px);\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:clamp(26px,3vw,44px);\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:2px;color:#8A3A1E;\">05<\u002Fspan>\n        <h2 style=\"margin:0;font-weight:900;font-size:clamp(26px,3.4vw,40px);letter-spacing:-1.2px;\">What it costs<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1px;background:rgba(28,24,21,.16);border:1px solid rgba(28,24,21,.16);\">\n        <div style=\"background:#F3EFE6;padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:20px;\">\n          <div style=\"display:flex;flex-direction:column;gap:5px;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:2px;color:#6E655A;\">FREE<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:clamp(34px,4vw,46px);letter-spacing:-2px;line-height:1;\">$0<\u002Fdiv>\n            <div style=\"font-size:14.5px;font-weight:500;color:#4A443D;\">Forever. No card.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:0;border-top:1px solid rgba(28,24,21,.13);\">\n            <sc-for list=\"{{ freeRows }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;gap:11px;padding:11px 0;border-bottom:1px solid rgba(28,24,21,.09);font-size:14.5px;font-weight:500;color:#2E2822;line-height:1.45;\">\n                <span style=\"color:#4C5B3C;font-weight:700;flex:0 0 auto;\">{{ f.mark }}<\u002Fspan><span>{{ f.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <a href=\"{{ appUrl }}\" style=\"margin-top:auto;display:flex;align-items:center;justify-content:center;height:50px;border:1px solid rgba(28,24,21,.24);color:#1C1815;font-weight:800;font-size:14px;letter-spacing:.5px;border-radius:2px;\" style-hover=\"border-color:#1C1815;background:#EAE4D8;\">Start free<\u002Fa>\n        <\u002Fdiv>\n\n        <div style=\"background:#FBF8F1;padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:20px;position:relative;\">\n          <div style=\"position:absolute;top:0;left:0;right:0;height:3px;background:#B5502F;\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:2px;color:#B5502F;\">PLUS<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:8px;\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:clamp(34px,4vw,46px);letter-spacing:-2px;line-height:1;\">$4.99<\u002Fdiv>\n              <div style=\"font-size:15px;font-weight:600;color:#6E655A;\">/ month<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:14.5px;font-weight:500;color:#4A443D;\">Or pay less up front:<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:1px;background:rgba(28,24,21,.16);border:1px solid rgba(28,24,21,.16);\">\n            <sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"flex:1;background:#FBF8F1;padding:11px 10px;display:flex;flex-direction:column;gap:2px;\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;letter-spacing:-.6px;\">{{ p.price }}<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:1px;color:#6E655A;\">{{ p.term }}<\u002Fspan>\n                <span style=\"font-size:11.5px;font-weight:600;color:#4C5B3C;\">{{ p.save }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:0;border-top:1px solid rgba(28,24,21,.13);\">\n            <sc-for list=\"{{ plusRows }}\" as=\"p2\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;gap:11px;padding:11px 0;border-bottom:1px solid rgba(28,24,21,.09);font-size:14.5px;font-weight:500;color:#2E2822;line-height:1.45;\">\n                <span style=\"color:#B5502F;font-weight:700;flex:0 0 auto;\">{{ p2.mark }}<\u002Fspan><span>{{ p2.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <a href=\"{{ appUrl }}\" style=\"margin-top:auto;display:flex;align-items:center;justify-content:center;height:50px;background:#B5502F;color:#FBF8F1;font-weight:800;font-size:14px;letter-spacing:.5px;border-radius:2px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16);\" style-hover=\"background:#8A3A1E;\">Get Plus<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:1px;color:#6E655A;\">CANCEL ANY TIME · PLUS RUNS TO THE END OF THE PERIOD YOU PAID FOR<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faq\" style=\"border-top:1px solid rgba(28,24,21,.13);background:#EDEAE0;\">\n    <div style=\"max-width:900px;margin:0 auto;padding:clamp(44px,6vw,84px) clamp(18px,4vw,44px);\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:clamp(22px,3vw,36px);\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:2px;color:#8A3A1E;\">06<\u002Fspan>\n        <h2 style=\"margin:0;font-weight:900;font-size:clamp(26px,3.4vw,40px);letter-spacing:-1.2px;\">Questions<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(28,24,21,.2);\">\n        <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"8\">\n          <div style=\"border-bottom:1px solid rgba(28,24,21,.14);\">\n            <button sc-camel-on-click=\"{{ q.toggle }}\" aria-expanded=\"{{ q.open }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;background:none;border:none;cursor:pointer;text-align:left;font-family:'Archivo',sans-serif;font-weight:700;font-size:clamp(16px,1.7vw,18.5px);letter-spacing:-.3px;color:#1C1815;\" style-hover=\"color:#8A3A1E;\">\n              <span>{{ q.q }}<\u002Fspan>\n              <span style=\"{{ q.iconStyle }}\">+<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ q.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:0 0 20px;font-size:15.5px;font-weight:500;line-height:1.6;color:#4A443D;max-width:62ch;text-wrap:pretty;\">{{ q.a }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"border-top:1px solid rgba(28,24,21,.13);\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(18px,4vw,44px);display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;\">\n      <h2 style=\"margin:0;font-weight:900;font-size:clamp(30px,5vw,58px);line-height:1;letter-spacing:-2px;max-width:16ch;text-wrap:balance;\">Go outside. We'll do the map part.<\u002Fh2>\n      <a href=\"{{ appUrl }}\" style=\"display:flex;align-items:center;height:56px;padding:0 34px;background:#B5502F;color:#FBF8F1;font-weight:800;font-size:15.5px;letter-spacing:.6px;border-radius:2px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16);\" style-hover=\"background:#8A3A1E;\" style-active=\"transform:translateY(1px);\">Open Squiggle<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid rgba(28,24,21,.13);background:#EAE4D8;\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:clamp(30px,4vw,44px) clamp(18px,4vw,44px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;\">\n      <div style=\"display:flex;flex-direction:column;gap:4px;\">\n        <span style=\"font-weight:900;font-size:16px;letter-spacing:-.4px;\">SQUIGGLE<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:1.2px;color:#6E655A;\">MADE IN SOMERVILLE, MA<\u002Fspan>\n      <\u002Fdiv>\n      <nav style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;\">\n        <a href=\"/privacy.html\" style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:1.2px;color:#6E655A;text-transform:uppercase;\" style-hover=\"color:#1C1815;\">Privacy<\u002Fa>\n        <a href=\"/terms.html\" style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:1.2px;color:#6E655A;text-transform:uppercase;\" style-hover=\"color:#1C1815;\">Terms<\u002Fa>\n        <a href=\"mailto:hello@squiggleapp.net\" style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:1.2px;color:#6E655A;text-transform:uppercase;\" style-hover=\"color:#1C1815;\">Contact<\u002Fa>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:1.2px;color:#6E655A;\">© 2026<\u002Fspan>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(18px,4vw,44px) clamp(24px,3vw,36px);font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:400;letter-spacing:.6px;line-height:1.6;color:#6E655A;max-width:70ch;\">Map data © OpenStreetMap contributors. Route surfaces and path types derived from OSM. Squiggle suggests routes; it does not guarantee that any road is safe to ride. Use your own judgment out there.<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;appUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/app&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;apiBase&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://squiggle-rwgps.hellosquiggleapp.workers.dev&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;showWaitlist&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { faq: -1, email: '', city: '', busy: false, done: false, err: '', msg: '' };\n\n  STEPS = [\n    { n: 'STEP 01', title: 'Start where you are', body: \"Squiggle uses your location for the start pin. Driving somewhere first? Drop it anywhere on the map instead.\" },\n    { n: 'STEP 02', title: 'Say how far', body: \"Five miles, forty, whatever's in you today. Distance is the only thing you have to decide.\" },\n    { n: 'STEP 03', title: 'Take the one you like', body: \"Plus riders get a pile of five. Swipe through, keep the good one, send it to the computer on your bars.\" },\n  ];\n\n  RINGS = [\n    { label: 'BOSTON', towns: ['Allston', 'Back Bay', 'Beacon Hill', 'Brighton', 'Charlestown', 'Dorchester', 'Downtown', 'East Boston', 'Fenway', 'Hyde Park', 'Jamaica Plain', 'Mattapan', 'Mission Hill', 'North End', 'Roslindale', 'Roxbury', 'Seaport', 'South Boston', 'South End', 'West Roxbury'] },\n    { label: 'INNER RING', towns: ['Arlington', 'Belmont', 'Braintree', 'Brookline', 'Cambridge', 'Chelsea', 'Dedham', 'Everett', 'Malden', 'Medford', 'Melrose', 'Milton', 'Needham', 'Newton', 'Quincy', 'Revere', 'Somerville', 'Waltham', 'Watertown', 'Winthrop'] },\n    { label: 'OUT TO THE EDGE', towns: ['Acton', 'Andover', 'Bedford', 'Beverly', 'Billerica', 'Burlington', 'Canton', 'Chelmsford', 'Concord', 'Danvers', 'Dover', 'Framingham', 'Hingham', 'Holliston', 'Lexington', 'Lincoln', 'Lowell', 'Lynn', 'Marblehead', 'Medfield', 'Nahant', 'Natick', 'Norwood', 'Peabody', 'Randolph', 'Reading', 'Salem', 'Saugus', 'Sharon', 'Sherborn', 'Stoneham', 'Stoughton', 'Sudbury', 'Swampscott', 'Tewksbury', 'Wakefield', 'Wayland', 'Wellesley', 'Weston', 'Westford', 'Westwood', 'Weymouth', 'Winchester', 'Woburn'] },\n  ];\n\n  EXPORTS = [\n    { name: 'RideWithGPS', note: 'Connect once. Routes land in your account, ready to navigate.' },\n    { name: 'GPX', note: 'The plain file. Works with anything that reads a route.' },\n    { name: 'Garmin & Wahoo', note: 'Load the GPX like any other course.' },\n    { name: 'Home screen', note: 'Add to Home Screen and it opens like an app.' },\n  ];\n\n  FREE = [\n    { mark: '+', text: 'One route at a time, as many times as you like' },\n    { mark: '+', text: 'Five generations every three hours' },\n    { mark: '+', text: 'Full map, turn cues, and elevation' },\n    { mark: '+', text: 'Surface, climb, and hazard read-outs' },\n    { mark: '+', text: 'Save routes to your account' },\n  ];\n\n  PLUS = [\n    { mark: '+', text: 'Everything in Free' },\n    { mark: '+', text: 'Five routes at once — swipe and keep the best' },\n    { mark: '+', text: 'No generation limit' },\n    { mark: '+', text: 'Any distance you want, not just the presets' },\n    { mark: '+', text: 'Push straight to RideWithGPS' },\n    { mark: '+', text: 'GPX download' },\n  ];\n\n  PLANS = [\n    { price: '$4.99', term: 'MONTHLY', save: '' },\n    { price: '$23.99', term: '6 MONTHS', save: 'save 20%' },\n    { price: '$39.99', term: '12 MONTHS', save: 'save 33%' },\n  ];\n\n  FAQS = [\n    { q: 'Do I need to download an app?', a: \"No. Squiggle runs in your browser. On a phone, hit Share and then Add to Home Screen — it gets its own icon, loses the address bar, and keeps working when the signal drops out in the Fells.\" },\n    { q: 'How is this different from a route builder like Strava or Komoot?', a: \"Those are drawing tools. You click points, they connect them. Squiggle goes the other direction: you give it one number and it hands you a finished loop. It's for the days you want to ride but don't want to plan.\" },\n    { q: 'Can I export to my Garmin or Wahoo?', a: \"Yes, with Plus. Download the GPX and load it as a course the same way you load anything else, or push the route to RideWithGPS and let it sync across on its own.\" },\n    { q: 'Where does the map data come from?', a: \"OpenStreetMap for road surfaces and the path network, Google for the routing itself, and a hand-built list of the region's rail trails, greenways and protected spines so the router actually uses them instead of stitching side streets together.\" },\n    { q: 'How does it decide which roads to use?', a: \"It weights against junctions that MassDOT and Boston open data flag as crash clusters, prefers separated paths and quiet streets over arterials, and tells you outright when a path is unlit and empty after dark. That's a routing preference, not a promise. Ride like nobody has seen you.\" },\n    { q: 'Can I use it for running or walking?', a: \"It's built around bikes — surface, climb and turn density are all tuned for riding. Short loops work fine on foot, but a 30-mile Squiggle is not a walk.\" },\n    { q: 'How do I cancel?', a: \"One button in Settings. It opens Stripe's billing portal, you cancel there, and Plus stays on until the end of the period you already paid for.\" },\n    { q: 'Do you track my location?', a: \"Your location is read in the browser to place the start pin and center the map. It isn't sent to us or stored. Saved routes live in your account only because you pressed save.\" },\n  ];\n\n  api = () => (this.props.apiBase || 'https://squiggle-rwgps.hellosquiggleapp.workers.dev').replace(/\\/+$/, '');\n\n  submitWait = (e) => {\n    e.preventDefault();\n    if (this.state.busy) return;\n    const email = this.state.email.trim(), city = this.state.city.trim();\n    if (!email || !city) { this.setState({ err: 'Both fields, please.' }); return; }\n    this.setState({ busy: true, err: '' });\n    fetch(this.api() + '/waitlist', {\n      method: 'POST',\n      headers: { 'content-type': 'application/json' },\n      body: JSON.stringify({ email, city }),\n    })\n      .then(r => r.json().catch(() => ({})).then(b => ({ ok: r.ok, b })))\n      .then(({ ok, b }) => {\n        if (!ok) throw new Error((b && b.error) || 'failed');\n        this.setState({ busy: false, done: true, msg: \"We'll email you when \" + city + \" is live. Nothing else.\" });\n      })\n      .catch(() => this.setState({ busy: false, err: \"That didn't go through. Try again in a minute, or email hello@squiggleapp.net.\" }));\n  };\n\n  renderVals() {\n    const s = this.state;\n    return {\n      appUrl: this.props.appUrl || '/app',\n      showWaitlist: this.props.showWaitlist !== false,\n      steps: this.STEPS,\n      exports: this.EXPORTS,\n      freeRows: this.FREE,\n      plusRows: this.PLUS,\n      plans: this.PLANS,\n      rings: this.RINGS.map(r => ({ ...r, count: r.towns.length + (r.label === 'BOSTON' ? ' NEIGHBORHOODS' : ' TOWNS') })),\n      faqs: this.FAQS.map((f, i) => ({\n        q: f.q, a: f.a, open: s.faq === i,\n        toggle: () => this.setState({ faq: s.faq === i ? -1 : i }),\n        iconStyle: 'flex:0 0 auto;font-family:\\'IBM Plex Mono\\',monospace;font-weight:500;font-size:20px;line-height:1;color:#8A3A1E;transition:transform .22s cubic-bezier(.2,.8,.3,1);transform:rotate(' + (s.faq === i ? '45deg' : '0deg') + ');',\n      })),\n      waitEmail: s.email,\n      waitCity: s.city,\n      waitBusy: s.busy,\n      waitErr: s.err,\n      waitMsg: s.msg,\n      waitDone: s.done,\n      waitOpen: !s.done,\n      onEmail: (e) => this.setState({ email: e.target.value }),\n      onCity: (e) => this.setState({ city: e.target.value }),\n      submitWait: this.submitWait,\n      waitBtnLabel: s.busy ? 'Sending…' : 'Put me on the list',\n      waitBtnStyle: 'height:50px;background:' + (s.busy ? '#7C8A68' : '#4C5B3C') + ';color:#F3EFE6;font-family:\\'Archivo\\',sans-serif;font-weight:800;font-size:14px;letter-spacing:.5px;border:none;border-radius:2px;cursor:' + (s.busy ? 'default' : 'pointer') + ';box-shadow:inset 0 -2px 0 rgba(0,0,0,.16);',\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
